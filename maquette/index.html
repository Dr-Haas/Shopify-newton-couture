<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Newton Couture Boutique</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,200;0,300;0,400;0,500;1,300&display=swap">
<style>
/* Layout: presentation deck (theme A/B/C, page Accueil/Produit/Panier, ordinateur/mobile) above one live storefront.
   A = Atelier layout on a starry night sky, B = Atelier on studio cream, C = Formule on white.
   Each storefront is a fixed brand look, so the page is single-theme by choice; every color is set explicitly. */
:root{
  --deck-bg:#E9E6E0; --deck-ink:#1B1A17; --deck-mute:#6A645A; --deck-line:#D1CBC0; --deck-on:#1B1A17; --deck-on-ink:#F5F1E9; --deck-card:#FFFFFF;
  --f-ui:"Poppins","Helvetica Neue",Arial,sans-serif;
  --f-bodoni:"Poppins","Helvetica Neue",Arial,sans-serif;
  --f-inst:"Instrument Serif","Times New Roman",Georgia,serif;
  --f-geist:"Geist","Helvetica Neue",Arial,sans-serif;
  --f-gmono:"Geist Mono",ui-monospace,Menlo,monospace;
  --ease:cubic-bezier(.2,.7,.1,1);
  --deck-h:64px; --vh:800px;
}
html{background:var(--deck-bg)}
body{background:var(--deck-bg);color:var(--deck-ink);font-family:var(--f-ui);padding-inline:16px;padding-block:0 40px}
*{box-sizing:border-box}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid #C08A2E;outline-offset:3px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------------- Deck ---------------- */
.deck{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--deck-bg);border-bottom:1px solid var(--deck-line);margin-inline:-16px;padding:10px 16px;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
.deck-id{display:flex;flex-direction:column;gap:1px;margin-right:auto;min-width:0}
.deck-id b{font-weight:500;font-size:12.5px;letter-spacing:.16em;text-transform:uppercase}
.deck-id span{font-size:12px;color:var(--deck-mute)}
.seg{display:flex;gap:3px;background:var(--deck-card);border:1px solid var(--deck-line);border-radius:999px;padding:3px;overflow-x:auto;max-width:100%}
.seg button{border:0;background:transparent;padding:7px 13px;border-radius:999px;cursor:pointer;font-size:13px;white-space:nowrap;transition:background .25s,color .25s}
.seg button[aria-pressed="true"]{background:var(--deck-on);color:var(--deck-on-ink)}
.seg button b{font-weight:500;margin-right:5px}
.note{max-width:1320px;margin:12px auto 12px;display:flex;flex-wrap:wrap;gap:4px 16px;align-items:baseline;font-size:13.5px;line-height:1.5}
.note strong{font-weight:500;letter-spacing:.1em;text-transform:uppercase;font-size:11.5px}
.note span{color:var(--deck-mute)}
.stage-wrap{max-width:1320px;margin-inline:auto}
.frame{container:site/inline-size;position:relative;box-shadow:0 1px 2px rgba(0,0,0,.08),0 24px 60px -24px rgba(0,0,0,.4);overflow:clip}
.frame.mobile{max-width:390px;margin-inline:auto;height:min(820px,82vh);overflow-y:auto;overflow-x:hidden;border:9px solid #141312;border-radius:40px;scrollbar-width:none;overscroll-behavior:contain}
.frame.mobile::-webkit-scrollbar{display:none}

/* ---------------- Theme tokens on the storefront ---------------- */
.site{position:relative;min-height:100%;font-family:var(--f-ui);-webkit-font-smoothing:antialiased;background:var(--bg);color:var(--ink);
  --f-display:var(--f-bodoni); --f-body:var(--f-ui); --f-meta:var(--f-ui)}
.t-a{--bg:#07070B;--panel:rgba(255,255,255,.035);--panel-2:#111018;--ink:#F3ECDD;--mute:#A39B8B;--accent:#D4B06A;--accent-ink:#0A0A0E;--line:rgba(212,176,106,.24);--btn:#D4B06A;--btn-ink:#0A0A0E;--chip:rgba(10,10,14,.6);--chip-ink:#F3ECDD}
.t-b{--bg:#F3EEE5;--panel:#FBF8F2;--panel-2:#EAE2D4;--ink:#1C1915;--mute:#6A6257;--accent:#8A6B2F;--accent-ink:#FBF8F2;--line:#DCD2C1;--btn:#1C1915;--btn-ink:#F3EEE5;--chip:rgba(251,248,242,.82);--chip-ink:#1C1915}
.t-c{--bg:#FFFFFF;--panel:#F4F3EF;--panel-2:#EAE8E2;--ink:#0F0F0E;--mute:#65635E;--accent:#9C7A36;--accent-ink:#FFFFFF;--line:#E3E1DB;--btn:#0F0F0E;--btn-ink:#FFFFFF;--chip:rgba(255,255,255,.88);--chip-ink:#0F0F0E;
  --f-display:var(--f-inst); --f-body:var(--f-geist); --f-meta:var(--f-gmono); font-family:var(--f-geist)}
.site h1,.site h2,.site h3,.site h4,.site p{margin:0}
.site h1,.site h2{text-wrap:balance}
.site a{color:inherit;text-decoration:none}
.site img{display:block;max-width:100%}
.content{position:relative;z-index:1}
.eyebrow{display:inline-block;font-family:var(--f-meta);font-size:11px;letter-spacing:.26em;text-transform:uppercase;color:var(--accent)}
.t-c .eyebrow{letter-spacing:.12em}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;background:var(--btn);color:var(--btn-ink);border:0;padding:17px 30px;font-family:var(--f-meta);font-size:11.5px;letter-spacing:.24em;text-transform:uppercase;cursor:pointer;border-radius:999px;transition:transform .5s var(--ease),filter .3s;will-change:transform}
.t-c .btn{border-radius:0;letter-spacing:.12em}
.btn:hover{filter:brightness(1.12)}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.lnk{background:none;border:0;padding:0 0 3px;cursor:pointer;font-family:var(--f-meta);font-size:11.5px;letter-spacing:.22em;text-transform:uppercase;border-bottom:1px solid currentColor}
.t-c .lnk{letter-spacing:.1em}
.price{font-variant-numeric:tabular-nums;white-space:nowrap}

/* ---------------- Sky (A) ---------------- */
.sky{display:none}
.t-a .sky{display:block;position:sticky;top:var(--sticky-top,0px);width:100%;height:var(--vh);margin-bottom:calc(-1 * var(--vh));z-index:0;pointer-events:none}

/* ---------------- Header ---------------- */
.hd{position:sticky;top:var(--sticky-top,0px);z-index:10;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px;padding:10px 16px;transition:transform .5s var(--ease),background .4s,border-color .4s;border-bottom:1px solid transparent}
.hd.solid{background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-color:var(--line)}
.hd.away{transform:translateY(-110%)}
.hd .logo{justify-self:center;cursor:pointer;background:none;border:0;padding:0}
.hd .logo img{height:38px;width:auto}
.t-b .hd .logo img,.t-c .hd .logo img{filter:brightness(.8) saturate(1.25)}
.hd nav{display:none;gap:30px}
.hd nav button{background:none;border:0;padding:4px 0;cursor:pointer;font-family:var(--f-meta);font-size:11.5px;letter-spacing:.2em;text-transform:uppercase;position:relative}
.t-c .hd nav button{letter-spacing:.08em}
.hd nav button::after{content:"";position:absolute;left:0;right:0;bottom:-2px;height:1px;background:currentColor;transform:scaleX(0);transform-origin:right;transition:transform .45s var(--ease)}
.hd nav button:hover::after{transform:scaleX(1);transform-origin:left}
.icons{display:flex;gap:2px;justify-content:flex-end}
.ico{display:inline-grid;place-items:center;width:38px;height:38px;position:relative;background:none;border:0;cursor:pointer;color:inherit;border-radius:50%}
.ico svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
.ico .hide-s{display:none}
.bagn{position:absolute;top:2px;right:0;font-family:var(--f-geist);font-size:9.5px;font-weight:500;line-height:16px;min-width:16px;padding:0 4px;text-align:center;border-radius:8px;background:var(--accent);color:var(--accent-ink);transition:transform .4s var(--ease)}
.bagn.bump{animation:bump .6s var(--ease)}
@keyframes bump{40%{transform:scale(1.6)}}
.ann{position:relative;z-index:11;text-align:center;font-family:var(--f-meta);font-size:10.5px;letter-spacing:.26em;text-transform:uppercase;padding:9px 16px;color:var(--accent);border-bottom:1px solid var(--line);overflow:hidden;white-space:nowrap}
.t-b .ann{background:var(--ink);color:var(--bg);border:0}
.t-c .ann{background:var(--panel);color:var(--mute);letter-spacing:.1em}
.overlay{position:sticky;top:var(--sticky-top,0px);height:0;z-index:40}
.menu{position:absolute;left:0;right:0;top:0;height:var(--vh);z-index:30;background:var(--bg);display:grid;align-content:center;gap:18px;padding:32px;clip-path:circle(0% at 30px 60px);transition:clip-path .7s var(--ease);pointer-events:none}
.menu.open{clip-path:circle(150% at 30px 60px);pointer-events:auto}
.menu button{background:none;border:0;text-align:left;font-family:var(--f-display);font-size:42px;cursor:pointer;padding:0}
.menu .x{position:absolute;top:18px;right:18px}

/* ---------------- Layered figure stage ---------------- */
.stage{position:relative;overflow:hidden;width:100%;height:100%;background:var(--panel);isolation:isolate}
.stage .plate,.stage .fig{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 30%;max-width:none}
.stage .fw{position:absolute;inset:0;z-index:2;transform:translate3d(var(--px,0px),calc(var(--py,0px) + var(--lift,0px)),0) scale(var(--sc,1));transform-origin:50% 100%;transition:transform .9s var(--ease);animation:float var(--d,6.5s) ease-in-out infinite;animation-delay:var(--dl,0s)}
@keyframes float{0%,100%{translate:0 -1.2%}50%{translate:0 -3.6%}}
.stage .plate{z-index:1;transition:transform 1.2s var(--ease)}
.stage.m-sky{background:transparent}
.stage.m-sky .halo{position:absolute;left:50%;top:52%;width:80%;aspect-ratio:1;translate:-50% -50%;border-radius:50%;background:radial-gradient(closest-side,rgba(212,176,106,.30),rgba(212,176,106,.08) 55%,transparent);z-index:1}
.stage.m-sky .fig{filter:drop-shadow(0 30px 40px rgba(0,0,0,.6))}
.stage.m-clean{background:var(--panel)}
.stage.m-clean .fig{filter:drop-shadow(0 26px 22px rgba(0,0,0,.12))}
.stage .orbit{position:absolute;left:50%;top:50%;width:118%;translate:-50% -50%;z-index:1;fill:none;stroke:var(--accent);stroke-width:.6;opacity:.55;animation:spin 28s linear infinite}
.stage .orbit circle{fill:var(--accent);stroke:none}
@keyframes spin{to{rotate:360deg}}
.stage.ph{display:grid;place-items:center;align-content:center;gap:16px;background:var(--panel)}
.t-a .stage.ph{background:radial-gradient(70% 60% at 50% 45%,rgba(212,176,106,.12),transparent 70%)}
.stage.ph svg{width:46%;fill:none;stroke:var(--accent);stroke-width:1}
.stage.ph svg g{transform-origin:60px 60px;animation:spin 16s linear infinite}
.stage.ph svg g:nth-child(2){animation-duration:22s;animation-direction:reverse}
.stage.ph svg .core{fill:var(--accent);stroke:none;animation:pulse 3s ease-in-out infinite;transform-origin:60px 60px}
@keyframes pulse{50%{scale:1.25}}
.stage.ph span{font-family:var(--f-meta);font-size:10.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--mute)}
/* zoom views (product page) move plate + figure together */
.stage .zoomer{position:absolute;inset:0;transition:transform 1s var(--ease);transform-origin:50% 40%}
.stage.z-belt .zoomer{transform:scale(2.3);transform-origin:50% 44%}
.stage.z-leg .zoomer{transform:scale(2);transform-origin:50% 92%}

/* ---------------- Reveal + split ---------------- */
.rv-wait{opacity:0;transform:translateY(40px)}
.rv-in{opacity:1;transform:none;transition:opacity 1s var(--ease),transform 1.1s var(--ease)}
.split .w{display:inline-block;overflow:hidden;vertical-align:bottom;padding-bottom:.06em;margin-bottom:-.06em}
.split .w>span{display:inline-block;animation:rise 1.1s var(--ease) backwards;animation-delay:calc(var(--i) * 70ms + 120ms)}
@keyframes rise{from{transform:translateY(105%)}}
.fade-up{animation:fadeup 1.1s var(--ease) backwards;animation-delay:var(--dl,.5s)}
@keyframes fadeup{from{opacity:0;transform:translateY(24px)}}

/* ---------------- Cursor ---------------- */
.cursor{position:fixed;left:0;top:0;z-index:60;width:84px;height:84px;margin:-42px 0 0 -42px;border-radius:50%;display:grid;place-items:center;pointer-events:none;font-family:var(--f-ui);font-size:10.5px;letter-spacing:.22em;text-transform:uppercase;background:#D4B06A;color:#0A0A0E;scale:0;transition:scale .4s var(--ease)}
.cursor.on{scale:1}

/* ---------------- Toast ---------------- */
.toast{position:absolute;z-index:40;right:16px;top:78px;width:min(340px,calc(100% - 32px));display:grid;grid-template-columns:64px 1fr;gap:14px;align-items:center;padding:12px;background:var(--panel-2);color:var(--ink);border:1px solid var(--line);box-shadow:0 20px 50px -20px rgba(0,0,0,.45);transform:translateY(-12px);opacity:0;pointer-events:none;transition:.5s var(--ease)}
.t-a .toast{background:#15131C}
.toast.show{opacity:1;transform:none;pointer-events:auto}
.toast .thumb{aspect-ratio:3/4}
.toast p{font-size:13px;line-height:1.4}
.toast b{display:block;font-family:var(--f-display);font-weight:400;font-size:18px}
.toast .row{display:flex;gap:14px;margin-top:8px}
.flyer{position:fixed;z-index:70;pointer-events:none;border-radius:50%;overflow:hidden}

/* ================= HOME A/B (Atelier) ================= */
.h-hero{display:grid;gap:28px;padding:28px 16px 48px;position:relative}
.h-copy{display:grid;gap:20px;align-content:center;position:relative;z-index:3}
.h-copy h1{font-family:var(--f-display);font-weight:400;font-size:clamp(52px,9.4cqi,140px);line-height:.9;letter-spacing:-.035em}
.h-copy h1 em{font-style:italic;color:var(--accent)}
.h-copy p{color:var(--mute);font-size:16px;line-height:1.65;max-width:38ch}
.ctas{display:flex;flex-wrap:wrap;gap:22px;align-items:center}
.h-visual{position:relative;aspect-ratio:4/5;max-height:78vh}
.h-visual .stage{border-radius:0}
.t-b .h-visual .stage{border-radius:280px 280px 0 0}
.t-a .h-visual .stage{overflow:visible}
.chip{position:absolute;z-index:4;display:flex;gap:10px;align-items:center;padding:10px 14px;border-radius:999px;background:var(--chip);color:var(--chip-ink);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);font-size:12px;letter-spacing:.04em;box-shadow:0 10px 30px -12px rgba(0,0,0,.35);animation:float2 7s ease-in-out infinite}
.chip i{width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 25%,transparent)}
@keyframes float2{50%{translate:0 -10px}}
.chip.c1{left:-4%;top:22%}
.chip.c2{right:-2%;bottom:16%;animation-delay:-3s}
.scroll-cue{display:none;font-family:var(--f-meta);font-size:10.5px;letter-spacing:.26em;text-transform:uppercase;color:var(--mute);gap:12px;align-items:center}
.scroll-cue::before{content:"";width:1px;height:42px;background:linear-gradient(var(--accent),transparent);animation:cue 2s var(--ease) infinite}
@keyframes cue{0%{transform:scaleY(0);transform-origin:top}50%{transform:scaleY(1);transform-origin:top}51%{transform-origin:bottom}100%{transform:scaleY(0);transform-origin:bottom}}
.marq{overflow:hidden;border-block:1px solid var(--line);padding:16px 0;white-space:nowrap;position:relative}
.t-b .marq{background:var(--ink);color:var(--bg);border:0}
.marq-in{display:inline-flex;will-change:transform}
.marq span{font-family:var(--f-display);font-style:italic;font-size:clamp(22px,3.2cqi,40px);padding-right:.5em}
.marq span b{font-style:normal;color:var(--accent);font-weight:400;padding:0 .3em}
.sec{padding:72px 16px}
.sec-h{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:end;gap:16px;margin-bottom:36px}
.sec-h h2{font-family:var(--f-display);font-weight:400;font-size:clamp(40px,6.4cqi,88px);line-height:.95;letter-spacing:-.03em}
.sec-h h2 em{font-style:italic;color:var(--accent)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:28px 12px}
.card{position:relative;display:grid;gap:12px;min-width:0;align-content:start}
.cmw{position:relative}
.card-media{position:relative;display:block;aspect-ratio:3/4;cursor:pointer;background:none;border:0;padding:0;width:100%}
.t-a .card-media{border:1px solid var(--line);border-radius:200px 200px 0 0;overflow:hidden;background:radial-gradient(80% 60% at 50% 70%,rgba(212,176,106,.12),transparent 70%)}
.t-b .card-media .stage{transition:border-radius .8s var(--ease)}
.card-media:hover .fw{--sc:1.06;--lift:-2%}
.card-media:hover .plate{transform:scale(1.03)}
.card .num{position:absolute;top:12px;left:14px;z-index:3;font-family:var(--f-display);font-size:14px;color:var(--chip-ink)}
.t-a .card .num{left:50%;translate:-50% 0;top:16px;color:var(--accent)}
.quick{position:absolute;z-index:3;right:10px;bottom:10px;width:40px;height:40px;border-radius:50%;border:0;background:var(--chip);color:var(--chip-ink);backdrop-filter:blur(8px);cursor:pointer;display:grid;place-items:center;font-size:20px;line-height:1;transition:transform .4s var(--ease),background .3s}
.quick:hover{transform:rotate(90deg) scale(1.08);background:var(--accent);color:var(--accent-ink)}
.card-meta{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:baseline}
.card-meta h3{font-family:var(--f-display);font-weight:400;font-size:clamp(20px,2.4cqi,28px);letter-spacing:-.01em}
.card-meta span{font-size:12.5px;color:var(--mute);grid-column:1}
.card-meta .price{grid-column:2;grid-row:1;font-size:14px;color:var(--ink)}
.t-a .card-meta{text-align:center;grid-template-columns:1fr;justify-items:center}
.t-a .card-meta .price{grid-column:1;grid-row:auto;color:var(--accent)}
.manifesto{padding:96px 16px}
.manifesto p{font-family:var(--f-display);font-size:clamp(30px,5.2cqi,72px);line-height:1.08;letter-spacing:-.025em;max-width:20ch}
.manifesto .mw{opacity:var(--o,.22);transition:opacity .25s linear}
.manifesto em{font-style:italic;color:var(--accent)}
.manifesto .sig{margin-top:28px;display:flex;gap:18px;align-items:center;font-family:var(--f-meta);font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--mute)}
.belt{display:grid;gap:28px;padding:24px 16px 80px}
.belt-vis{position:relative;aspect-ratio:1/1;overflow:hidden}
.t-b .belt-vis{border-radius:12px}
.t-a .belt-vis{border:1px solid var(--line)}
.belt-vis .stage .zoomer{transform:scale(var(--z,1.6));transform-origin:50% 44%;transition:none}
.belt-txt{display:grid;gap:18px;align-content:center}
.belt-txt h2{font-family:var(--f-display);font-weight:400;font-size:clamp(36px,5cqi,68px);line-height:.98;letter-spacing:-.025em}
.belt-txt p{color:var(--mute);line-height:1.7;max-width:46ch}
.belt-txt ul{list-style:none;margin:0;padding:0;display:grid;border-top:1px solid var(--line)}
.belt-txt li{display:flex;justify-content:space-between;gap:16px;padding:14px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.belt-txt li span:last-child{font-family:var(--f-meta);font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--accent)}
.moments{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--line)}
.mt{position:relative;overflow:hidden;min-height:180px;padding:22px 16px;border-bottom:1px solid var(--line);border-right:1px solid var(--line);display:grid;align-content:space-between;cursor:pointer;background:none;border-left:0;border-top:0;text-align:left}
.mt h3{font-family:var(--f-display);font-style:italic;font-weight:400;font-size:clamp(26px,3.2cqi,40px);position:relative;z-index:2}
.mt p{font-size:12px;color:var(--mute);letter-spacing:.04em;position:relative;z-index:2}
.mt img{position:absolute;right:-6%;bottom:-8%;height:120%;width:auto;max-width:none;z-index:1;opacity:0;transform:translateY(30%) rotate(6deg);transition:opacity .5s,transform .9s var(--ease)}
.mt:hover img{opacity:.95;transform:translateY(0) rotate(0)}
.mt:hover{background:var(--panel)}
.quote{padding:110px 16px;text-align:center;position:relative}
.quote p{font-family:var(--f-display);font-weight:400;font-size:clamp(34px,6cqi,84px);line-height:1.02;letter-spacing:-.03em}
.quote em{font-style:italic;color:var(--accent)}
.news{display:grid;justify-items:center;text-align:center;gap:12px;padding:72px 16px;border-top:1px solid var(--line)}
.news h2{font-family:var(--f-display);font-weight:400;font-size:clamp(34px,4.4cqi,56px);letter-spacing:-.02em}
.news>p{color:var(--mute)}
.nl{display:flex;width:100%;max-width:460px;margin-top:10px;border-bottom:1px solid var(--ink)}
.nl input{flex:1;min-width:0;font:inherit;font-size:15px;padding:14px 2px;border:0;background:transparent;color:inherit}
.nl input::placeholder{color:var(--mute)}
.nl button{background:none;border:0;cursor:pointer;font-family:var(--f-meta);font-size:11.5px;letter-spacing:.22em;text-transform:uppercase}
.nl-msg{font-size:13px;min-height:1.2em;color:var(--accent)}
.foot{position:relative;padding:56px 16px 24px;border-top:1px solid var(--line)}
.t-b .foot{background:var(--ink);color:var(--bg);border:0;--mute:#B4AB9C;--line:#3A352D}
.foot-top{display:grid;grid-template-columns:1fr 1fr;gap:32px 20px}
.foot-brand{grid-column:1/-1}
.foot-brand img{height:56px;width:auto}
.t-c .foot-brand img{filter:brightness(.8) saturate(1.25)}
.foot-brand p{margin-top:12px;font-size:14px;color:var(--mute)}
.foot h4{font-family:var(--f-meta);font-size:11px;letter-spacing:.2em;text-transform:uppercase;font-weight:400;margin-bottom:12px;color:var(--accent)}
.foot-top button{display:block;background:none;border:0;padding:5px 0;cursor:pointer;font-size:14px;color:var(--mute);text-align:left}
.foot-top button:hover{color:inherit}
.foot-big{font-family:var(--f-display);font-size:clamp(56px,15cqi,220px);line-height:.8;letter-spacing:-.05em;margin-top:48px;white-space:nowrap;overflow:hidden;opacity:.9}
.foot-big em{font-style:italic;color:var(--accent)}
.foot-bot{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-top:24px;padding-top:18px;border-top:1px solid var(--line);font-size:12px;color:var(--mute)}

/* ================= HOME C (Formule) ================= */
.c-hero{display:grid;gap:28px;padding:28px 16px 40px}
.c-hero h1{font-family:var(--f-display);font-weight:400;font-size:clamp(54px,9cqi,136px);line-height:.88;letter-spacing:-.035em}
.c-hero h1 em{font-style:italic;color:var(--accent)}
.c-hero p{color:var(--mute);font-size:16px;line-height:1.65;max-width:42ch}
.c-lab{display:grid;gap:10px}
.c-lab .readout{display:flex;justify-content:space-between;font-family:var(--f-meta);font-size:11.5px;color:var(--mute);letter-spacing:.06em}
.c-lab .readout b{color:var(--ink);font-weight:500}
.c-swap{position:relative;aspect-ratio:4/5}
.c-swap .stage{position:absolute;inset:0}
.c-swap .stage .fw{transition:transform .9s var(--ease),opacity .6s}
.c-swap .stage.out .fw{--lift:-120%;opacity:0;transition:transform .8s cubic-bezier(.6,0,.8,.4),opacity .5s .2s}
.c-swap .stage.pre .fw{--lift:60%;opacity:0;transition:none}
.c-swap .elbig{position:absolute;top:12px;left:12px;z-index:3}
.ptable{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.el{position:relative;aspect-ratio:1;border:1px solid var(--ink);padding:7px;display:grid;grid-template-rows:auto 1fr auto;background:var(--bg);color:var(--ink);cursor:pointer;transition:background .3s,color .3s,transform .4s var(--ease);text-align:left}
.el:hover{transform:translateY(-4px)}
.el[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.el .z{font-family:var(--f-meta);font-size:10px}
.el .m{position:absolute;top:7px;right:7px;font-family:var(--f-meta);font-size:9px;color:var(--accent)}
.el .sy{font-family:var(--f-display);font-size:clamp(24px,4cqi,46px);justify-self:center;align-self:center;line-height:1}
.el .nm{font-family:var(--f-meta);font-size:8.5px;letter-spacing:.06em;text-transform:uppercase;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{display:grid;background:var(--bg);color:var(--ink);border:1px solid var(--ink);padding:5px 8px 4px;min-width:46px;font-family:var(--f-display);font-size:24px;line-height:1}
.badge b{font-family:var(--f-meta);font-weight:400;font-size:9px;margin-bottom:2px}
.rain{border-block:1px solid var(--line);padding:18px 16px;overflow:hidden;text-align:center}
.rain-t{font-family:var(--f-meta);font-size:clamp(20px,5.6cqi,74px);letter-spacing:.3em;white-space:nowrap}
.rain-t i{font-style:normal;color:var(--accent)}
.t-c .grid{grid-auto-flow:column;grid-auto-columns:70%;grid-template-columns:none;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:10px;gap:14px}
.t-c .card{scroll-snap-align:start}
.t-c .card-media .badge{position:absolute;top:10px;left:10px;z-index:3}
.t-c .card-meta span{font-family:var(--f-meta);font-size:11px}
.t-c .card-meta .price{font-family:var(--f-meta);font-size:13px}
.formula{background:var(--panel);border-block:1px solid var(--line)}
.formula ul{list-style:none;margin:0;padding:0}
.formula li{display:grid;grid-template-columns:1fr auto;align-items:center;gap:10px;padding:16px 0;border-bottom:1px solid var(--line);cursor:pointer}
.formula .eq{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:baseline;font-family:var(--f-meta);font-size:13px}
.formula .eq i{font-style:normal;color:var(--accent)}
.formula .eq b{font-family:var(--f-display);font-weight:400;font-size:clamp(26px,3.4cqi,44px);letter-spacing:-.01em}
.formula .mini{width:56px;height:72px;overflow:hidden;opacity:.25;transition:opacity .4s,transform .6s var(--ease)}
.formula li:hover .mini{opacity:1;transform:translateY(-6px)}
.formula .mini img{width:100%;height:100%;object-fit:cover;object-position:50% 30%}
.spec .tw{overflow-x:auto}
.spec table{border-collapse:collapse;width:100%;min-width:720px;font-size:13.5px}
.spec th{font-family:var(--f-meta);font-weight:400;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);text-align:left;padding:10px 12px;border-bottom:1px solid var(--ink)}
.spec td{padding:14px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
.spec tr{transition:background .3s}
.spec tbody tr:hover{background:var(--panel)}
.num{text-align:right;font-family:var(--f-meta);font-variant-numeric:tabular-nums;white-space:nowrap}
.tsy{display:inline-grid;place-items:center;width:30px;height:30px;border:1px solid var(--ink);font-family:var(--f-display);font-size:16px;margin-right:10px;vertical-align:middle}

/* ================= PRODUCT ================= */
.pdp{padding:14px 16px 40px}
.crumbs{display:flex;gap:8px;font-family:var(--f-meta);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);margin-bottom:16px;flex-wrap:wrap}
.crumbs button{background:none;border:0;padding:0;cursor:pointer;color:inherit;font:inherit;letter-spacing:inherit;text-transform:inherit}
.crumbs b{color:var(--ink);font-weight:400}
.pdp-grid{display:grid;gap:28px}
.pdp-media{display:grid;gap:10px;min-width:0}
.pdp-main{position:relative;aspect-ratio:4/5}
.t-a .pdp-main{border:1px solid var(--line)}
.t-b .pdp-main .stage{border-radius:10px}
.pdp-main .tag{position:absolute;z-index:4;left:14px;bottom:14px;font-family:var(--f-meta);font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;padding:8px 12px;border-radius:999px;background:var(--chip);color:var(--chip-ink);backdrop-filter:blur(8px)}
.t-c .pdp-main .tag{border-radius:0}
.thumbs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.thumb-b{position:relative;aspect-ratio:1;padding:0;border:1px solid var(--line);background:none;cursor:pointer;overflow:hidden;opacity:.6;transition:opacity .3s,border-color .3s}
.thumb-b[aria-pressed="true"]{opacity:1;border-color:var(--ink)}
.thumb-b .stage .fw{animation:none}
.thumb-b span{position:absolute;z-index:4;left:6px;bottom:6px;font-family:var(--f-meta);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;background:var(--chip);color:var(--chip-ink);padding:3px 6px}
.pdp-info{display:grid;gap:18px;align-content:start;min-width:0}
.pdp-info h1{font-family:var(--f-display);font-weight:400;font-size:clamp(48px,6.6cqi,96px);line-height:.9;letter-spacing:-.035em}
.pdp-top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.pdp-price{display:flex;align-items:baseline;gap:12px;font-size:22px}
.pdp-price small{font-size:12px;color:var(--mute)}
.pdp-info .short{color:var(--mute);line-height:1.65}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips span{font-family:var(--f-meta);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;padding:6px 10px;border:1px solid var(--line);border-radius:999px}
.t-c .chips span{border-radius:0}
.sizes{border:0;padding:0;margin:0;display:grid;gap:10px}
.sizes legend{display:flex;justify-content:space-between;width:100%;font-family:var(--f-meta);font-size:11px;letter-spacing:.18em;text-transform:uppercase;padding:0;margin-bottom:10px}
.sizes legend button{background:none;border:0;padding:0;cursor:pointer;text-decoration:underline;text-underline-offset:3px;color:var(--mute);font:inherit;letter-spacing:inherit;text-transform:none}
.size-row{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.size-row label{position:relative}
.size-row input{position:absolute;opacity:0;inset:0;cursor:pointer}
.size-row span{display:grid;place-items:center;height:48px;border:1px solid var(--line);font-size:14px;transition:background .25s,color .25s,border-color .25s}
.t-a .size-row span,.t-b .size-row span{border-radius:999px}
.size-row input:checked+span{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.size-row input:focus-visible+span{outline:2px solid #C08A2E;outline-offset:2px}
.buy{display:grid;grid-template-columns:auto 1fr;gap:10px}
.qty{display:flex;align-items:center;border:1px solid var(--line);border-radius:999px;height:54px}
.t-c .qty{border-radius:0}
.qty button{width:42px;height:100%;background:none;border:0;cursor:pointer;font-size:18px}
.qty output{min-width:24px;text-align:center;font-variant-numeric:tabular-nums}
.buy .btn{height:54px}
.btn.wide{width:100%}
.btn .ok{display:none}
.btn.done .ok{display:inline}
.btn.done .lbl{display:none}
.acc{border-top:1px solid var(--line)}
.acc details{border-bottom:1px solid var(--line)}
.acc summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;padding:16px 0;font-family:var(--f-meta);font-size:11.5px;letter-spacing:.18em;text-transform:uppercase}
.acc summary::-webkit-details-marker{display:none}
.acc summary::after{content:"+";font-size:18px;transition:rotate .4s var(--ease)}
.acc details[open] summary::after{rotate:45deg}
.acc .body{padding:0 0 18px;color:var(--mute);line-height:1.7;font-size:14.5px}
.acc ul{margin:0;padding-left:18px}
.todo{color:var(--accent)}
.related{padding:64px 0 8px}
.t-a .related .grid,.t-b .related .grid{grid-template-columns:1fr 1fr}
.sticky-buy{position:sticky;bottom:0;z-index:9;display:flex;gap:12px;align-items:center;justify-content:space-between;padding:10px 12px;margin:24px -16px -40px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);border-top:1px solid var(--line)}
.sticky-buy b{font-family:var(--f-display);font-weight:400;font-size:20px}
.sticky-buy .btn{padding:14px 20px}

/* ================= CART ================= */
.cart{padding:24px 16px 40px}
.cart h1{font-family:var(--f-display);font-weight:400;font-size:clamp(48px,7cqi,104px);line-height:.9;letter-spacing:-.035em;display:flex;align-items:flex-start;gap:10px}
.cart h1 sup{font-family:var(--f-meta);font-size:14px;letter-spacing:.1em;color:var(--accent);margin-top:.4em}
.cart-grid{display:grid;gap:32px;margin-top:28px}
.lines{display:grid;border-top:1px solid var(--line)}
.line{display:grid;grid-template-columns:92px 1fr;gap:16px;padding:18px 0;border-bottom:1px solid var(--line);overflow:hidden;transition:opacity .4s,transform .5s var(--ease)}
.line.gone{opacity:0;transform:translateX(30px)}
.line .lm{aspect-ratio:3/4;cursor:pointer;border:0;padding:0;background:none}
.t-a .line .lm{border:1px solid var(--line)}
.t-b .line .lm .stage{border-radius:6px}
.line .li{display:grid;gap:6px;align-content:start;min-width:0}
.line .li h3{font-family:var(--f-display);font-weight:400;font-size:24px;line-height:1}
.line .li small{font-family:var(--f-meta);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
.line .lc{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px;margin-top:8px}
.line .qty{height:40px}
.line .qty button{width:34px}
.rm{background:none;border:0;padding:0;cursor:pointer;font-size:12px;color:var(--mute);text-decoration:underline;text-underline-offset:3px}
.line .lt{font-size:16px}
.summary{display:grid;gap:14px;align-content:start;padding:22px;background:var(--panel);border:1px solid var(--line)}
.t-a .summary{background:rgba(20,18,28,.75);backdrop-filter:blur(10px)}
.t-b .summary{border-radius:12px}
.summary h2{font-family:var(--f-meta);font-weight:400;font-size:11.5px;letter-spacing:.2em;text-transform:uppercase}
.sumrow{display:flex;justify-content:space-between;gap:10px;font-size:14.5px}
.sumrow span:first-child{color:var(--mute)}
.sumrow.total{font-size:20px;padding-top:14px;border-top:1px solid var(--line)}
.sumrow.total span:first-child{color:var(--ink);font-family:var(--f-display)}
.promo{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.t-c .promo{border-radius:0}
.promo input{flex:1;min-width:0;border:0;background:transparent;color:inherit;font:inherit;font-size:14px;padding:12px 14px}
.promo input::placeholder{color:var(--mute)}
.promo button{background:none;border:0;border-left:1px solid var(--line);padding:0 16px;cursor:pointer;font-family:var(--f-meta);font-size:11px;letter-spacing:.14em;text-transform:uppercase}
.promo-msg{font-size:12.5px;color:var(--accent);min-height:1em}
.express{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.express button{height:44px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer;font-family:var(--f-geist);font-size:13px;font-weight:500;letter-spacing:.01em}
.secure{display:flex;gap:8px;align-items:center;justify-content:center;font-size:12px;color:var(--mute)}
.secure svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.6}
.orline{display:flex;align-items:center;gap:12px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.orline::before,.orline::after{content:"";flex:1;height:1px;background:var(--line)}
.empty{display:grid;gap:18px;justify-items:start;padding:40px 0}
.empty p{color:var(--mute)}
.anim-num{display:inline-block}

/* ================= Container breakpoints ================= */
@container site (min-width:760px){
  .hd{padding:16px 40px;grid-template-columns:1fr auto 1fr}
  .hd nav{display:flex}
  .hd .burger{display:none}
  .t-b .hd,.t-c .hd{grid-template-columns:auto 1fr auto}
  .t-b .hd .logo,.t-c .hd .logo{justify-self:start;grid-column:1;grid-row:1}
  .t-b .hd nav,.t-c .hd nav{justify-self:center;grid-column:2;grid-row:1}
  .t-b .hd .icons,.t-c .hd .icons{grid-column:3;grid-row:1}
  .t-a .hd nav{grid-column:1;grid-row:1}
  .t-a .hd .logo{grid-column:2}
  .ico .hide-s,.ico.hide-s{display:inline-grid}
  .h-hero{grid-template-columns:1.05fr .95fr;gap:40px;padding:40px 40px 72px;min-height:min(760px,calc(var(--vh) - 40px))}
  .scroll-cue{display:flex}
  .sec{padding:110px 40px}
  .grid{grid-template-columns:repeat(6,1fr);gap:64px 24px}
  .t-a .grid .card,.t-b .grid .card{grid-column:span 2}
  .t-a .grid .card:nth-child(1),.t-b .grid .card:nth-child(1){grid-column:span 3}
  .t-a .grid .card:nth-child(2),.t-b .grid .card:nth-child(2){grid-column:span 3}
  .t-b .grid .card:nth-child(2){margin-top:110px}
  .t-a .grid .card:nth-child(3),.t-a .grid .card:nth-child(5){margin-top:60px}
  .t-c .grid{grid-auto-flow:row;grid-template-columns:repeat(3,1fr);overflow:visible}
  .manifesto{padding:150px 40px}
  .belt{grid-template-columns:1fr 1fr;gap:64px;padding:40px 40px 120px}
  .moments{grid-template-columns:repeat(4,1fr)}
  .mt{min-height:280px;padding:32px 28px}
  .quote{padding:170px 40px}
  .news{padding:110px 40px}
  .foot{padding:72px 40px 28px}
  .foot-top{grid-template-columns:2fr 1fr 1fr 1fr}
  .foot-brand{grid-column:auto}
  .c-hero{grid-template-columns:1.1fr .9fr;gap:56px;padding:48px 40px 64px;align-items:center}
  .rain{padding:22px 40px}
  .formula li{grid-template-columns:1fr 80px}
  .formula .mini{width:80px;height:104px}
  .pdp{padding:20px 40px 64px}
  .pdp-grid{grid-template-columns:1.15fr .85fr;gap:56px;align-items:start}
  .pdp-info{position:sticky;top:calc(var(--sticky-top,0px) + 96px)}
  .related .grid{grid-template-columns:repeat(3,1fr)}
  .related .grid .card{grid-column:auto!important;margin-top:0!important}
  .sticky-buy{display:none}
  .cart{padding:40px 40px 72px}
  .cart-grid{grid-template-columns:1.5fr 1fr;gap:56px;align-items:start}
  .summary{position:sticky;top:calc(var(--sticky-top,0px) + 96px);padding:28px}
  .line{grid-template-columns:120px 1fr}
}
@container site (min-width:1100px){
  .t-c .grid{grid-template-columns:repeat(5,1fr)}
  .t-c .related .grid{grid-template-columns:repeat(3,1fr)}
}
/* ======== Composition retenue : Poppins, accroche sur une ligne, formule ======== */
.site em,.marq span,.mt h3,.quote em,.edito .big{font-style:normal}
.h-copy h1,.h-title,.sec-h h2,.belt-txt h2,.quote p,.news h2,.pdp-info h1,.cart h1,.foot-big,.card-meta h3,.line .li h3,.toast b,.menu button{font-weight:300;letter-spacing:-.035em}
.sec-h h2{font-size:clamp(32px,4.6cqi,62px);line-height:1}
.h-hero{grid-template-columns:1fr}
.h-eye{order:0}
.h-title{font-family:var(--f-display);font-weight:300;font-size:clamp(34px,10.5cqi,64px);line-height:1;position:relative;z-index:2;margin:6px 0 0}
.h-title em{color:var(--accent);font-weight:400}
.h-copy{order:3}
.h-visual{order:2;max-height:none}
.quote p{font-size:clamp(28px,4.4cqi,60px);line-height:1.1}
.belt-txt h2{font-size:clamp(30px,3.8cqi,52px);line-height:1.05}
.news h2{font-size:clamp(28px,3.4cqi,44px)}
.pdp-info h1{font-size:clamp(40px,5.2cqi,72px);line-height:1}
.cart h1{font-size:clamp(40px,5.6cqi,80px);line-height:1}
.foot-big{font-size:clamp(44px,10.5cqi,150px);line-height:.95}
.marq span{font-weight:300;letter-spacing:-.01em}
.mt h3{font-weight:300;letter-spacing:-.02em}
.card-meta h3{font-size:clamp(17px,1.8cqi,22px);font-weight:400;letter-spacing:-.01em}
.menu button{font-size:34px}
.fx{background:transparent;border:0}
.fx .sec-h{align-items:end}
.fx-sub{color:var(--mute);max-width:36ch;line-height:1.6;font-size:14.5px}
.fx ul{border-top:1px solid var(--line)}
.fx li{grid-template-columns:auto 1fr 64px;gap:14px;padding:18px 0;position:relative}
.fx li::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(212,176,106,.10),transparent 70%);opacity:0;transition:opacity .5s}
.fx li:hover::before{opacity:1}
.fx-no{font-size:11px;letter-spacing:.2em;color:var(--accent);align-self:center}
.fx .eq{font-family:var(--f-ui);font-size:12.5px;color:var(--mute);letter-spacing:.02em}
.fx .eq i{color:var(--accent);font-size:16px}
.fx .eq b{font-family:var(--f-display);font-weight:300;color:var(--ink);font-size:clamp(24px,3.2cqi,42px);letter-spacing:-.03em;transition:color .4s,letter-spacing .6s var(--ease)}
.fx li:hover .eq b{color:var(--accent);letter-spacing:-.01em}
.fx-price{display:none;font-size:14px;color:var(--accent)}
.fx .mini{width:64px;height:84px;opacity:.85}
.fx .mini svg{width:100%;height:100%;fill:none;stroke:var(--accent);stroke-width:1.2}
.fx .mini svg .core{fill:var(--accent);stroke:none}
.rate-link{display:inline-flex;gap:10px;align-items:center;background:none;border:0;padding:0;cursor:pointer;font-size:12.5px;color:var(--mute);text-decoration:underline;text-underline-offset:3px;justify-self:start}
.stars{letter-spacing:2px;color:var(--line);text-decoration:none}
.rate-link .stars{color:color-mix(in srgb,var(--accent) 35%,var(--line))}
.reviews{padding:72px 0 0}
.rv-box{display:grid;gap:18px;padding:24px;border:1px solid var(--line);background:var(--panel)}
.t-b .rv-box{border-radius:12px}
.rv-score{display:flex;align-items:baseline;gap:14px}
.rv-score b{font-family:var(--f-display);font-weight:300;font-size:48px;line-height:1}
.rv-score .stars{font-size:18px;color:color-mix(in srgb,var(--accent) 35%,var(--line))}
.rv-score small{color:var(--mute);font-size:13px}
.rv-box p{color:var(--mute);line-height:1.6;max-width:56ch}
.rv-form{display:grid;gap:12px;margin-top:16px;max-width:560px}
.rv-form input:not([type=radio]),.rv-form textarea{font:inherit;font-size:14.5px;padding:13px 14px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;resize:vertical}
.rv-stars{border:0;padding:0;margin:0;display:flex;flex-direction:row-reverse;justify-content:flex-end;gap:4px}
.rv-lab{font-size:11px;letter-spacing:.18em;text-transform:uppercase}
.fx .eq b{width:100%}
.rv-stars input{position:absolute;opacity:0;width:1px;height:1px}
.rv-stars label{font-size:28px;color:var(--line);cursor:pointer;transition:color .2s,transform .3s var(--ease)}
.rv-stars label:hover,.rv-stars label:hover~label,.rv-stars input:checked~label{color:var(--accent)}
.rv-stars label:hover{transform:scale(1.15)}
.rv-stars input:focus-visible+label{outline:2px solid #C08A2E;outline-offset:2px}
.rv-msg{font-size:13px;color:var(--accent);min-height:1em}
.rv-form .btn{justify-self:start}
@container site (min-width:760px){
  .h-hero{grid-template-columns:.85fr 1.15fr;grid-template-rows:auto auto 1fr;column-gap:40px;row-gap:0;align-items:start;min-height:0;padding-top:48px}
  .h-eye{grid-column:1/-1;grid-row:1}
  .h-title{grid-column:1/-1;grid-row:2;white-space:nowrap;font-size:clamp(40px,5.7cqi,86px);margin:14px 0 0}
  .h-copy{grid-column:1;grid-row:3;align-self:end;padding-bottom:40px}
  .h-visual{grid-column:2;grid-row:2/4;margin-top:clamp(40px,4.5cqi,64px);width:min(100%,470px);justify-self:center;z-index:3}
  .fx li{grid-template-columns:70px 1fr 120px 96px;gap:20px;padding:22px 0}
  .fx .eq b{width:auto}
  .fx-price{display:block;text-align:right}
  .fx .mini{width:96px;height:124px}
  .reviews .sec-h{align-items:end}
}
@media (prefers-reduced-motion:reduce){
  .stage .fw,.stage .orbit,.chip,.stage.ph svg g,.stage.ph svg .core,.scroll-cue::before,.split .w>span,.fade-up{animation:none!important}
  .rv-wait{opacity:1;transform:none}
  ::view-transition-group(*),::view-transition-old(*),::view-transition-new(*){animation:none!important}
}
::view-transition-old(root){animation:.45s var(--ease) both vtout}
::view-transition-new(root){animation:.7s var(--ease) both vtin}
@keyframes vtout{to{opacity:0;transform:translateY(-14px)}}
@keyframes vtin{from{opacity:0;transform:translateY(22px)}}
::view-transition-group(fig){animation-duration:.8s;animation-timing-function:cubic-bezier(.2,.7,.1,1)}

/* ---------- render + navigation ---------- */
function scroller(){return S.view==='m'?frame:document.scrollingElement}
function setScroll(y){ if(S.view==='m')frame.scrollTop=y; else window.scrollTo(0,y) }
function stageTop(){ return S.view==='m'?0:frame.getBoundingClientRect().top+window.scrollY-$('#deck').offsetHeight }
function render(anchor){
  S.theme=S.page==='home'?'a':'b';
  site.className='site t-'+S.theme;
  content.innerHTML=S.page==='home'?(S.theme==='c'?homeFormule():homeAtelier()):S.page==='product'?product():cart();
  $$('[data-theme-btn]').forEach(function(b){b.setAttribute('aria-pressed',b.dataset.themeBtn===S.theme)});
  $$('[data-page-btn]').forEach(function(b){b.setAttribute('aria-pressed',b.dataset.pageBtn===S.page)});
  $('#n-t').textContent=PNOTES[S.page][0]; $('#n-d').textContent=PNOTES[S.page][1];
  $('#toast').classList.remove('show');
  measure();
  var target=anchor&&$('#'+anchor,content);
  if(target){ var y=target.getBoundingClientRect().top-(S.view==='m'?frame.getBoundingClientRect().top:0)+(S.view==='m'?frame.scrollTop:window.scrollY)-70; setScroll(Math.max(0,y)) }
  else setScroll(S.view==='m'?0:Math.max(0,Math.min(window.scrollY,stageTop())));
  setupReveal(); if(S.page==='home'&&S.theme==='c'){rain();cycleStart()} else cycleStop();
  initStars();
}
function go(dest,srcEl){
  var parts=dest.split('#'), page=parts[0], anchor=parts[1], k=null;
  if(page.indexOf('product:')===0){k=page.split(':')[1];page='product'}
  var update=function(){ S.page=page; if(k){ if(k!==S.k){S.zoom='';S.qty=1} S.k=k } render(anchor) };
  if(page===S.page&&(!k||k===S.k)&&anchor&&$('#'+anchor,content)){ var t=$('#'+anchor,content); var y=t.getBoundingClientRect().top-(S.view==='m'?frame.getBoundingClientRect().top:0)+(S.view==='m'?frame.scrollTop:window.scrollY)-70; (S.view==='m'?frame:window).scrollTo({top:y,behavior:reduce?'auto':'smooth'}); return }
  closeMenu();
  if(document.startViewTransition&&!reduce){
    var st=srcEl&&srcEl.querySelector&&srcEl.querySelector('[data-stage]');
    if(st&&page==='product'&&!st.closest('.thumbs')){ var ms=$('.main-stage',content); if(ms&&ms!==st)ms.style.viewTransitionName='none'; st.style.viewTransitionName='fig' }
    document.startViewTransition(update);
  } else update();
}

/* ---------- events ---------- */
document.addEventListener('click',function(e){
  var t=e.target.closest('button,a,[data-go],tr');
  if(!t)return;
  if(t.dataset.themeBtn){ if(t.dataset.themeBtn!==S.theme){ var u=function(){S.theme=t.dataset.themeBtn;render()}; document.startViewTransition&&!reduce?document.startViewTransition(u):u() } return }
  if(t.dataset.pageBtn){ var pg=t.dataset.pageBtn; go(pg==='product'?'product:'+S.k:pg); return }
  if(t.dataset.viewBtn){ S.view=t.dataset.viewBtn; frame.classList.toggle('mobile',S.view==='m'); $$('[data-view-btn]').forEach(function(b){b.setAttribute('aria-pressed',b===t)}); render(); return }
  if(!site.contains(t))return;
  if(t.matches('a'))e.preventDefault();
  if(t.hasAttribute('data-menu')){ $('#menu').classList.contains('open')?closeMenu():openMenu(); return }
  if(t.dataset.add){ e.stopPropagation(); addToCart(t.dataset.add,'M',1,t.closest('.card').querySelector('[data-stage]')); return }
  if(t.hasAttribute('data-add-main')){ addToCart(S.k,S.size,S.qty,$('.main-stage',content)); var b=$('#atc'); if(b){b.classList.add('done');setTimeout(function(){b.classList.remove('done')},1800)} return }
  if(t.hasAttribute('data-buynow')){ addToCart(S.k,S.size,S.qty,null,true); go('cart'); return }
  if(t.hasAttribute('data-review')){ var f=$('#rv-form'); f.hidden=!f.hidden; if(!f.hidden)$('#rv-name').focus(); return }
  if(t.dataset.go){ go(t.dataset.go,t); return }
  if(t.dataset.q){ S.qty=Math.max(1,Math.min(9,S.qty+ +t.dataset.q)); $('#qty').textContent=S.qty; var l=$('#atc .lbl'); if(l)l.textContent='Ajouter au panier · '+fmt.format(P[S.k].price*S.qty); return }
  if(t.dataset.zoom!==undefined){ S.zoom=t.dataset.zoom; var m=$('.main-stage',content); m.classList.remove('z-belt','z-leg'); if(S.zoom)m.classList.add(S.zoom); $$('.thumb-b',content).forEach(function(x){x.setAttribute('aria-pressed',x===t)}); return }
  if(t.dataset.lq){ var c=S.cart[S.theme], i=+t.dataset.lq; c[i].q=Math.max(1,Math.min(9,c[i].q+ +t.dataset.d)); refreshCart(); return }
  if(t.dataset.rm){ var row=t.closest('.line'); row.classList.add('gone'); setTimeout(function(){S.cart[S.theme].splice(+t.dataset.rm,1); refreshCart(true)},reduce?0:380); return }
  if(t.hasAttribute('data-el')){ cycleStop(); pickEl(t.dataset.el); return }
  if(t.hasAttribute('data-checkout')){ toast('<p style="grid-column:1/-1"><b>Étape suivante : paiement</b>Ici, le client est envoyé vers le paiement sécurisé de Shopify. Non inclus dans la maquette.</p>'); return }
});

/* ---------- cart logic ---------- */
function addToCart(k,size,q,fromStage,silent){
  var c=S.cart[S.theme], ex=c.filter(function(l){return l.k===k&&l.size===size})[0];
  if(ex)ex.q=Math.min(9,ex.q+q); else c.push({k:k,size:size,q:q});
  var bag=$('#bagbtn'), n=$('#bagn');
  var done=function(){ n.textContent=cartCount(); n.classList.remove('bump'); void n.offsetWidth; n.classList.add('bump') };
  if(fromStage&&!reduce&&bag){
    var r=fromStage.getBoundingClientRect(), br=bag.getBoundingClientRect(), fl=document.createElement('div');
    fl.className='flyer'; var sz=Math.min(r.width,r.height)*.6;
    fl.style.cssText+='width:'+sz+'px;height:'+sz+'px;left:'+(r.left+r.width/2-sz/2)+'px;top:'+(r.top+r.height/2-sz/2)+'px;background:'+getComputedStyle(site).getPropertyValue('--panel');
    fl.innerHTML=P[k].img?'<img src="img/fig_'+k+'.webp" alt="" style="width:100%;height:100%;object-fit:cover;object-position:50% 25%">':'';
    document.body.appendChild(fl);
    var dx=br.left+br.width/2-(r.left+r.width/2), dy=br.top+br.height/2-(r.top+r.height/2);
    fl.animate([{transform:'translate(0,0) scale(1)',opacity:1},{transform:'translate('+dx*.5+'px,'+(dy*.5-80)+'px) scale(.5)',opacity:1,offset:.55},{transform:'translate('+dx+'px,'+dy+'px) scale(.08)',opacity:.4}],{duration:900,easing:'cubic-bezier(.5,0,.3,1)'}).onfinish=function(){fl.remove();done()};
  } else done();
  if(!silent)toast('<div class="thumb">'+stage(k)+'</div><p><b>'+P[k].n+'</b>Taille '+size+' · ajouté au panier<span class="row"><button class="lnk" data-go="cart">Voir le panier</button></span></p>');
}
var tT;
function toast(html){ var t=$('#toast'); t.innerHTML=html; t.classList.add('show'); clearTimeout(tT); tT=setTimeout(function(){t.classList.remove('show')},3800) }
function refreshCart(rebuild){
  var n=cartCount(), t=cartTotal();
  $('#bagn').textContent=n; $('#cart-n').textContent=n+' article'+(n>1?'s':'');
  if(rebuild){ $('#lines').innerHTML=cartLines() }
  else $$('.line',content).forEach(function(row,i){var l=S.cart[S.theme][i];row.querySelector('output').textContent=l.q;row.querySelector('.lt').textContent=fmt.format(P[l.k].price*l.q)});
  tween($('#sub'),t); tween($('#tot'),t);
}
function tween(el,to){ if(!el)return; var from=parseFloat(el.dataset.v||to); el.dataset.v=to; if(reduce||from===to){el.textContent=fmt.format(to);return}
  var s=performance.now(); (function f(now){var k=Math.min(1,(now-s)/500), e=1-Math.pow(1-k,3); el.textContent=fmt.format(Math.round(from+(to-from)*e)); if(k<1)requestAnimationFrame(f)})(s) }

/* ---------- Formule: element picker (figures fall out and rise in) ---------- */
var cyc=null;
function pickEl(k){
  var sw=$('#c-swap'); if(!sw)return; var p=P[k];
  $$('[data-el]',content).forEach(function(b){b.setAttribute('aria-pressed',b.dataset.el===k)});
  $('#c-name').textContent=p.n; $('#c-mat').textContent=p.mat; $('#c-price').textContent=fmt.format(p.price);
  $('#c-badge').innerHTML='<b>'+p.no+'</b>'+p.s; var cta=$('#c-cta'); cta.dataset.go='product:'+k; cta.textContent='Voir '+p.n;
  var old=sw.querySelector('[data-stage]'); var tmp=document.createElement('div'); tmp.innerHTML=stage(k); var nw=tmp.firstChild;
  if(reduce){ old.replaceWith(nw); return }
  nw.classList.add('pre'); sw.insertBefore(nw,sw.firstChild); old.classList.add('out'); old.style.zIndex=2;
  setTimeout(function(){old.remove()},700);
  requestAnimationFrame(function(){requestAnimationFrame(function(){nw.classList.remove('pre')})});
}
function cycleStart(){ cycleStop(); if(reduce)return; var i=1; cyc=setInterval(function(){ if(S.page!=='home'||S.theme!=='c'){cycleStop();return} pickEl(ORDER[i++%ORDER.length]) },3600) }
function cycleStop(){ if(cyc){clearInterval(cyc);cyc=null} }
function rain(){
  var el=$('#rain'); if(!el||reduce)return; var fin='NEWTON COUTURE', POOL='0123456789NcMiVéLoHmDu+=', s=performance.now();
  (function step(now){ var k=Math.min(1,(now-s)/1600), out='';
    for(var i=0;i<fin.length;i++){ var ch=fin[i]; out+=(ch===' '||k*1.25>i/fin.length+Math.random()*.2)?ch:'<i>'+POOL[Math.floor(Math.random()*POOL.length)]+'</i>' }
    el.innerHTML=k<1?out:'NEWT<i>O</i>N COUTURE'; if(k<1)requestAnimationFrame(step) })(s);
}

/* ---------- reveal on scroll (only for things below the first screen) ---------- */
var io;
function setupReveal(){
  if(io)io.disconnect(); if(reduce||!('IntersectionObserver' in window))return;
  io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){e.target.classList.add('rv-in');e.target.classList.remove('rv-wait');io.unobserve(e.target)}})},{root:S.view==='m'?frame:null,rootMargin:'0px 0px -8% 0px'});
  var vb=viewBox();
  $$('[data-rv]',content).forEach(function(el,i){ var r=el.getBoundingClientRect(); if(r.top>vb.bottom){ el.classList.add('rv-wait'); el.style.transitionDelay=((i%3)*90)+'ms'; io.observe(el) } });
}
function viewBox(){ if(S.view==='m'){var r=frame.getBoundingClientRect(), t=r.top+frame.clientTop;return {top:t,bottom:t+frame.clientHeight,h:frame.clientHeight}} var d=$('#deck').offsetHeight; return {top:d,bottom:innerHeight,h:innerHeight-d} }

/* ---------- measurements for sticky header + sky ---------- */
function measure(){
  var dh=$('#deck').offsetHeight, vb=viewBox();
  site.style.setProperty('--sticky-top',(S.view==='m'?0:dh)+'px');
  site.style.setProperty('--vh',Math.round(vb.h)+'px');
  sizeSky();
}

/* ---------- pointer: parallax on figures, magnetic buttons, cursor ---------- */
var cursor=$('#cursor');
document.addEventListener('pointermove',function(e){
  if(e.pointerType!=='mouse')return;
  cursor.style.transform='translate('+e.clientX+'px,'+e.clientY+'px)';
  var over=e.target.closest&&e.target.closest('[data-cursor]');
  cursor.classList.toggle('on',!!over&&S.view==='d'&&!reduce);
  if(reduce)return;
  var hero=e.target.closest&&e.target.closest('[data-hero]');
  $$('[data-hero] .fw',content).forEach(function(fw){
    if(!hero){fw.style.setProperty('--px','0px');fw.style.setProperty('--py','0px');return}
    var r=hero.getBoundingClientRect(), x=(e.clientX-r.left)/r.width-.5, y=(e.clientY-r.top)/r.height-.5;
    fw.style.setProperty('--px',(x*-26).toFixed(1)+'px'); fw.style.setProperty('--py',(Math.min(0,y*-22)-6).toFixed(1)+'px');
  });
  var mb=e.target.closest&&e.target.closest('.magnetic');
  $$('.magnetic',content).forEach(function(b){ if(b!==mb){b.style.transform='';return} var r=b.getBoundingClientRect(); b.style.transform='translate('+((e.clientX-r.left-r.width/2)*.25).toFixed(1)+'px,'+((e.clientY-r.top-r.height/2)*.35).toFixed(1)+'px)' });
},{passive:true});

/* ---------- scroll-driven motion ---------- */
var lastY=0, vel=0, marqX=0, hdY=0;
function frameLoop(now){
  var sc=scroller(), y=S.view==='m'?frame.scrollTop:window.scrollY, vb=viewBox();
  var dy=y-lastY; lastY=y; vel=vel*.9+dy*.1;
  var hd=$('#hd',content);
  if(hd){ var rel=hd.getBoundingClientRect().top-vb.top; var pinned=Math.abs(rel)<3; hd.classList.toggle('solid',pinned&&(y>stageTop()+30||S.view==='m'&&y>30));
    if(pinned&&dy>4&&y>400)hd.classList.add('away'); else if(dy<-4||!pinned)hd.classList.remove('away'); }
  if(!reduce){
    var mq=$('[data-marq]',content); if(mq){ marqX-=(.5+Math.min(8,Math.abs(vel)*.35)); var w=mq.scrollWidth/4; if(-marqX>w)marqX+=w; mq.style.transform='translateX('+marqX+'px)' }
    var hs=$('[data-hero] .hero-stage .fw',content); if(hs){ var hr=hs.closest('[data-hero]').getBoundingClientRect(); var p=Math.max(0,(vb.top+40-hr.top)/hr.height); hs.style.setProperty('--lift',(-p*22).toFixed(2)+'%') }
    var bv=$('[data-belt]',content); if(bv){ var r=bv.getBoundingClientRect(); var p2=1-Math.min(1,Math.max(0,(r.top-vb.top)/(vb.h))); var z=1+p2*1.4; bv.querySelector('.zoomer').style.setProperty('--z',z.toFixed(3)); var fw=bv.querySelector('.fw'); if(fw)fw.style.setProperty('--lift',(-p2*3).toFixed(2)+'%') }
    var man=$('[data-manifesto]',content); if(man){ var ws=man.querySelectorAll('.mw'), mr=man.getBoundingClientRect(); var prog=Math.min(1,Math.max(0,(vb.bottom-mr.top-vb.h*.25)/(mr.height+vb.h*.35))); var lit=prog*ws.length*1.15; for(var i=0;i<ws.length;i++){ ws[i].style.setProperty('--o',(i<lit?1:.2)) } }
  } else { var man2=$('[data-manifesto]',content); if(man2)$$('.mw',man2).forEach(function(w){w.style.setProperty('--o',1)}) }
  drawSky(now,y);
  requestAnimationFrame(frameLoop);
}

/* ---------- starry sky (theme A): fixed field, slow twinkle, rare shooting star ---------- */
var sky=$('#sky'), stars=[], shoot=null, skyW=0, skyH=0, dpr=1;
function sizeSky(){
  var r=site.getBoundingClientRect(); var vb=viewBox();
  dpr=Math.min(window.devicePixelRatio||1,2); skyW=r.width; skyH=vb.h;
  sky.width=Math.round(skyW*dpr); sky.height=Math.round(skyH*dpr);
}
function initStars(){
  stars=[]; if(S.theme!=='a')return; sizeSky();
  var n=Math.round(skyW*skyH/1900);
  for(var i=0;i<n;i++)stars.push({x:Math.random(),y:Math.random(),r:Math.random()<.07?1.5:Math.random()*.9+.25,p:Math.random()*6.28,v:.3+Math.random()*1.3,g:Math.random()<.2,z:.02+Math.random()*.08});
  drawSky(performance.now(),0,true);
}
function drawSky(now,y,force){
  if(S.theme!=='a'||!stars.length)return;
  var c=sky.getContext('2d'); c.setTransform(dpr,0,0,dpr,0,0); c.clearRect(0,0,skyW,skyH);
  var t=now/1000;
  var g=c.createRadialGradient(skyW*.7,skyH*.25,0,skyW*.7,skyH*.25,skyW*.7); g.addColorStop(0,'rgba(60,46,90,.35)'); g.addColorStop(1,'rgba(7,7,11,0)'); c.fillStyle=g; c.fillRect(0,0,skyW,skyH);
  for(var i=0;i<stars.length;i++){ var s=stars[i]; var yy=((s.y*skyH-y*s.z)%skyH+skyH)%skyH;
    c.globalAlpha=reduce?.8:.3+.7*(.5+.5*Math.sin(s.p+t*s.v)); c.fillStyle=s.g?'#E6C88C':'#F5F0E6'; c.beginPath(); c.arc(s.x*skyW,yy,s.r,0,6.283); c.fill() }
  if(!reduce){
    if(!shoot&&Math.random()<.004)shoot={x:Math.random()*skyW*.7+skyW*.2,y:Math.random()*skyH*.4,t:t};
    if(shoot){ var k=(t-shoot.t)/1.1; if(k>1)shoot=null; else { var L=160, x=shoot.x-k*320, yy2=shoot.y+k*140; var gr=c.createLinearGradient(x,yy2,x+L,yy2-L*.44); gr.addColorStop(0,'rgba(240,220,170,'+(1-k)+')'); gr.addColorStop(1,'rgba(240,220,170,0)'); c.globalAlpha=1; c.strokeStyle=gr; c.lineWidth=1.2; c.beginPath(); c.moveTo(x,yy2); c.lineTo(x+L,yy2-L*.44); c.stroke() } }
  }
  c.globalAlpha=1;
}

window.addEventListener('resize',function(){measure();initStars()});
var h=(location.hash||'').replace('#','');
if(h==='produit')S.page='product'; else if(h==='panier')S.page='cart';
render();
requestAnimationFrame(frameLoop);
})();
</script>
